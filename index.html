<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>干饭搭子</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg: #FFF6E3; --surface: #FFFBEF; --primary: #FFB93D; --primary-deep: #F5A623;
      --ink: #6B4A2B; --muted: #A9855B; --accent: #E8593C; --accent-light: #FFD6CC;
      --border: #F2DFB6; --shadow: rgba(107,74,43,0.08); --success: #4CAF50;
      --slot-bg: rgba(255,255,255,0.5);
      --font-display: 'ZCOOL KuaiLe', system-ui, sans-serif;
      --font-body: 'Noto Sans SC', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --side-padding: clamp(12px, 3vw, 24px);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:#2A2118;--surface:#37291B;--primary:#FFD06B;--primary-deep:#FFB93D;
        --ink:#F4E3C4;--muted:#C4A87A;--accent:#FF7A5C;--accent-light:#5C2A1E;
        --border:#4A3926;--shadow:rgba(0,0,0,0.3);--success:#66BB6A;
        --slot-bg:rgba(0,0,0,0.15);
        color-scheme:dark;
      }
    }
    :root[data-theme="dark"] {
      --bg:#2A2118;--surface:#37291B;--primary:#FFD06B;--primary-deep:#FFB93D;
      --ink:#F4E3C4;--muted:#C4A87A;--accent:#FF7A5C;--accent-light:#5C2A1E;
      --border:#4A3926;--shadow:rgba(0,0,0,0.3);--success:#66BB6A;
      --slot-bg:rgba(0,0,0,0.15);
      color-scheme:dark;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
      padding-inline:var(--side-padding);
      padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);
      min-height:100vh;
    }
    .container{max-width:1200px;margin:0 auto;padding-block:20px}

    /* Header */
    .header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
    .title{font-family:var(--font-display);font-size:clamp(24px,5vw,36px);color:var(--primary);text-shadow:2px 2px 4px var(--shadow);display:flex;align-items:center;gap:10px}
    .title-emoji{font-size:1.2em;animation:wiggle 2s ease-in-out infinite}
    @keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

    /* Buddy list button */
    .buddy-btn{
      background:var(--surface);border:2px solid var(--border);border-radius:20px;
      padding:8px 14px;font-family:var(--font-body);font-size:13px;color:var(--ink);
      cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;
      max-width:200px;
    }
    .buddy-btn:hover{background:var(--primary);border-color:var(--primary-deep);transform:translateY(-2px)}
    .buddy-list{display:flex;flex-wrap:wrap;gap:4px;font-size:12px}
    .buddy-tag{background:var(--primary);color:var(--bg);padding:2px 8px;border-radius:10px;font-weight:500;white-space:nowrap}
    .buddy-tag.is-you{background:var(--accent);color:white}

    /* Month nav */
    .month-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
    .month-nav-btn{background:var(--surface);border:2px solid var(--border);border-radius:10px;padding:6px 14px;font-family:var(--font-body);font-size:13px;color:var(--ink);cursor:pointer;transition:all 0.2s;font-weight:500}
    .month-nav-btn:hover{background:var(--primary);border-color:var(--primary-deep);transform:translateY(-2px)}
    .month-label{font-family:var(--font-display);font-size:clamp(18px,4vw,24px);color:var(--ink);min-width:140px;text-align:center}

    /* Sync */
    .sync-indicator{text-align:center;padding:4px;font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px}
    .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

    .hint-text{text-align:center;font-size:11px;color:var(--muted);padding:4px 12px;margin-bottom:10px}

    /* Calendar grid */
    .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:24px}
    @media(max-width:768px){.calendar-grid{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:480px){.calendar-grid{grid-template-columns:repeat(3,1fr)}}
    .weekday-label{text-align:center;font-family:var(--font-display);font-size:12px;color:var(--muted);padding:4px 0;font-weight:500}

    /* Day cell */
    .day-cell{
      background:var(--surface);border:2px solid var(--border);border-radius:12px;
      padding:8px;min-height:120px;cursor:pointer;transition:all 0.2s;
      display:flex;flex-direction:column;gap:4px;position:relative;
    }
    .day-cell:hover{transform:translateY(-2px);box-shadow:0 4px 16px var(--shadow);border-color:var(--primary)}
    .day-cell.today{background:var(--primary);border-color:var(--primary-deep)}
    .day-cell.today .day-number{color:var(--bg)}
    .day-cell.today .slot-label{color:rgba(255,255,255,0.7)}
    .day-cell.today .slot-dish{color:var(--bg)}
    .day-cell.today .slot-participants{color:rgba(255,255,255,0.8)}
    .day-cell.drag-over{border-color:var(--success);border-width:3px;background:var(--accent-light)}
    .day-number{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:2px}

    /* Slot rows */
    .slot-row{
      background:var(--slot-bg);border-radius:8px;padding:4px 6px;
      cursor:pointer;transition:all 0.15s;min-height:28px;
      display:flex;flex-direction:column;gap:1px;
    }
    .slot-row:hover{background:var(--primary);border-radius:8px}
    .slot-row:hover .slot-label,.slot-row:hover .slot-dish,.slot-row:hover .slot-participants{color:var(--bg)}
    .slot-row.dragging{opacity:0.5}
    .slot-row[draggable="true"]{cursor:grab}
    .slot-row[draggable="true"]:active{cursor:grabbing}

    .slot-label{font-size:9px;color:var(--muted);font-weight:500;line-height:1}
    .slot-dish{font-size:11px;font-weight:500;color:var(--ink);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .slot-participants{font-size:9px;color:var(--muted);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Modals */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.3s}
    .modal-overlay.active{opacity:1;pointer-events:auto}
    .modal{background:var(--surface);border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform 0.3s}
    .modal-overlay.active .modal{transform:translateY(0)}
    .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .modal-title{font-family:var(--font-display);font-size:20px;color:var(--primary)}
    .modal-close{background:transparent;border:none;font-size:26px;color:var(--muted);cursor:pointer;padding:4px 10px;border-radius:8px;transition:all 0.2s}
    .modal-close:hover{background:var(--border);color:var(--ink)}

    /* Forms */
    .form-group{margin-bottom:14px}
    .form-label{display:block;font-family:var(--font-display);font-size:14px;color:var(--ink);margin-bottom:6px;font-weight:500}
    .form-input{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:10px 14px;font-family:var(--font-body);font-size:15px;color:var(--ink);transition:all 0.2s}
    .form-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,185,61,0.2)}
    .emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px}
    .emoji-btn{background:var(--bg);border:2px solid var(--border);border-radius:8px;padding:8px;font-size:20px;cursor:pointer;transition:all 0.2s;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
    .emoji-btn:hover{transform:scale(1.1);border-color:var(--primary)}
    .emoji-btn.selected{background:var(--primary);border-color:var(--primary-deep)}
    .submit-btn{width:100%;background:var(--primary);border:none;border-radius:12px;padding:12px;font-family:var(--font-display);font-size:16px;color:var(--bg);cursor:pointer;transition:all 0.2s;font-weight:700}
    .submit-btn:hover{background:var(--primary-deep);transform:translateY(-2px)}

    /* Detail */
    .detail-dish{font-size:20px;font-family:var(--font-display);color:var(--primary);margin-bottom:10px}
    .detail-section{margin-bottom:12px}
    .detail-label{font-size:12px;color:var(--muted);margin-bottom:3px}
    .detail-value{font-size:15px;font-weight:500;color:var(--ink)}
    .participant-list{display:flex;flex-wrap:wrap;gap:5px}
    .participant-tag{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px 10px;font-size:12px;color:var(--ink)}
    .participant-tag.is-you{background:var(--primary);color:var(--bg);border-color:var(--primary-deep)}
    .action-btns{display:flex;gap:8px;margin-top:14px}
    .btn-join{flex:1;background:var(--success);color:white;border:none;border-radius:10px;padding:10px;font-family:var(--font-display);font-size:14px;cursor:pointer;transition:all 0.2s}
    .btn-join:hover{opacity:0.9}
    .btn-leave{flex:1;background:var(--accent);color:white;border:none;border-radius:10px;padding:10px;font-family:var(--font-display);font-size:14px;cursor:pointer;transition:all 0.2s}
    .btn-leave:hover{opacity:0.9}
    .btn-delete{flex:1;background:var(--bg);color:var(--accent);border:2px solid var(--accent);border-radius:10px;padding:10px;font-family:var(--font-display);font-size:14px;cursor:pointer;transition:all 0.2s}
    .btn-delete:hover{background:var(--accent);color:white}

    /* Buddy modal */
    .buddy-modal-list{display:flex;flex-direction:column;gap:8px}
    .buddy-modal-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-radius:12px;border:1px solid var(--border)}
    .buddy-modal-item.is-you{border-color:var(--primary);background:var(--slot-bg)}
    .buddy-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--bg);font-weight:700;font-family:var(--font-display)}
    .buddy-modal-item.is-you .buddy-avatar{background:var(--accent)}
    .buddy-name{font-size:15px;font-weight:500;color:var(--ink)}
    .buddy-you-tag{font-size:11px;color:var(--muted);margin-left:4px}

    /* Toast */
    .toast-container{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:6px;width:90%;max-width:380px}
    .toast{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:12px 16px;box-shadow:0 6px 24px var(--shadow);animation:slideDown 0.3s ease-out;cursor:pointer}
    @keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
    .toast-title{font-family:var(--font-display);font-size:14px;color:var(--accent);margin-bottom:3px}
    .toast-body{font-size:12px;color:var(--ink)}
    .toast-actions{display:flex;gap:6px;margin-top:8px}
    .toast-btn{flex:1;border:none;border-radius:7px;padding:7px;font-family:var(--font-display);font-size:12px;cursor:pointer;transition:all 0.2s}
    .toast-btn-approve{background:var(--success);color:white}
    .toast-btn-reject{background:var(--bg);color:var(--accent);border:1px solid var(--accent)}

    *:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
    @media(prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="container">
    <header class="header">
      <h1 class="title">
        <span class="title-emoji">🍜</span>
        <span>干饭搭子</span>
        <span class="title-emoji">😋</span>
      </h1>
      <button class="buddy-btn" id="buddyBtn">
        <span>👥</span>
        <div class="buddy-list" id="buddyList"><span>加载中...</span></div>
      </button>
    </header>

    <nav class="month-nav">
      <button class="month-nav-btn" id="prevMonth">‹ 上月</button>
      <div class="month-label" id="monthLabel">2026年10月</div>
      <button class="month-nav-btn" id="nextMonth">下月 ›</button>
      <button class="month-nav-btn" id="todayBtn">今天</button>
    </nav>

    <div class="sync-indicator"><span class="sync-dot"></span><span>实时同步 · 拖拽slot可改期</span></div>
    <div class="hint-text">💡 点格子填写 · 拖拽改期 · 加入别人的饭搭子</div>

    <main><div class="calendar-grid" id="calendarGrid"></div></main>
  </div>

  <!-- Slot edit modal -->
  <div class="modal-overlay" id="slotModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="slotTitle">填什么？</h2>
        <button class="modal-close" id="slotClose">×</button>
      </div>
      <form id="slotForm">
        <div class="form-group">
          <label class="form-label" for="dishInput">️ 吃什么</label>
          <input type="text" id="dishInput" class="form-input" placeholder="番茄牛腩..." required autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">😊 心情</label>
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>
        <button type="submit" class="submit-btn" id="slotSubmitBtn">保存</button>
      </form>
    </div>
  </div>

  <!-- Slot detail modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="detailTitle">详情</h2>
        <button class="modal-close" id="detailClose">×</button>
      </div>
      <div id="detailContent"></div>
    </div>
  </div>

  <!-- Buddy list modal -->
  <div class="modal-overlay" id="buddyModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title"> 我的搭子们</h2>
        <button class="modal-close" id="buddyModalClose">×</button>
      </div>
      <div id="buddyModalContent"></div>
    </div>
  </div>

  <!-- Nickname modal -->
  <div class="modal-overlay" id="nicknameModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">你的昵称</h2>
        <button class="modal-close" id="nicknameClose">×</button>
      </div>
      <form id="nicknameForm">
        <div class="form-group">
          <label class="form-label" for="nicknameInput">👤 输入昵称</label>
          <input type="text" id="nicknameInput" class="form-input" placeholder="小明" required autocomplete="off" maxlength="20">
        </div>
        <button type="submit" class="submit-btn">确定</button>
      </form>
    </div>
  </div>

  <script>
    // Supabase
    const SUPABASE_URL = 'https://jqpnfdzndxlvmorpmkaz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcG5mZHpuZHhsdm1vcnBta2F6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3OTQ1MzIsImV4cCI6MjEwNzM3MDUzMn0.MbsmPCa81Fr_GhDpsZqB44BvXao8zpCSZzJWJyJnYac';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const EMOJIS = ['\u{1F60B}','\u{1F924}','\u{1F60D}','\u{1F970}','\u{1F622}','\u{1F914}','\u{1F35C}','\u{1F355}','\u{1F363}','\u{1F370}','\u{1F957}','\u{1F354}','\u{1F32E}','\u{1F371}','\u{1F372}','\u{1F95F}','\u{1F35B}','\u{1F35D}'];
    const SLOTS = [
      { key: 'meal1', label: '🍚 饭1' },
      { key: 'meal2', label: '🍚 饭2' },
      { key: 'drink', label: '🥤 饮品' }
    ];
    const NICKNAME_KEY = 'food-calendar-nickname';
    const WEEKDAYS = ['一','二','三','四','五','六','日'];
    const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let meals = {}; // { "2026-10-13-meal1": { dish, emoji, creator, participants }, ... }
    let nickname = localStorage.getItem(NICKNAME_KEY) || '';
    let selectedKey = null; // e.g. "2026-10-13-meal1"
    let selectedEmoji = '';
    let draggedKey = null;
    let pendingMoveRequests = [];

    const $ = id => document.getElementById(id);
    const calendarGrid = $('calendarGrid');
    const monthLabel = $('monthLabel');
    const buddyBtn = $('buddyBtn');
    const buddyList = $('buddyList');
    const slotModal = $('slotModal');
    const slotForm = $('slotForm');
    const slotTitle = $('slotTitle');
    const slotClose = $('slotClose');
    const dishInput = $('dishInput');
    const emojiGrid = $('emojiGrid');
    const slotSubmitBtn = $('slotSubmitBtn');
    const detailModal = $('detailModal');
    const detailTitle = $('detailTitle');
    const detailContent = $('detailContent');
    const detailClose = $('detailClose');
    const buddyModal = $('buddyModal');
    const buddyModalContent = $('buddyModalContent');
    const buddyModalClose = $('buddyModalClose');
    const nicknameModal = $('nicknameModal');
    const nicknameForm = $('nicknameForm');
    const nicknameInput = $('nicknameInput');
    const nicknameClose = $('nicknameClose');
    const toastContainer = $('toastContainer');

    // Helpers
    function formatDate(date) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }
    function parseParticipants(p) {
      if (!p) return [];
      if (Array.isArray(p)) return p;
      try { return JSON.parse(p); } catch { return []; }
    }
    function getSlotKey(dateStr, slotKey) { return `${dateStr}-${slotKey}`; }
    function parseSlotKey(key) {
      const parts = key.split('-');
      const slotKey = parts.pop();
      const dateStr = parts.join('-');
      return { dateStr, slotKey };
    }

    // Collect all buddies (unique participants)
    function getAllBuddies() {
      const set = new Set();
      Object.values(meals).forEach(m => {
        if (m.creator) set.add(m.creator);
        (m.participants || []).forEach(p => set.add(p));
      });
      const arr = Array.from(set);
      // Put self first
      if (nickname) {
        const idx = arr.indexOf(nickname);
        if (idx > 0) { arr.splice(idx, 1); arr.unshift(nickname); }
        else if (idx === -1) { arr.unshift(nickname); }
      }
      return arr;
    }

    function renderBuddyList() {
      const buddies = getAllBuddies();
      if (buddies.length === 0 || (buddies.length === 1 && buddies[0] === nickname)) {
        buddyList.innerHTML = nickname ? `<span class="buddy-tag is-you">${nickname}（你）</span>` : '<span>设置昵称</span>';
        return;
      }
      buddyList.innerHTML = buddies.slice(0, 4).map(b =>
        `<span class="buddy-tag${b === nickname ? ' is-you' : ''}">${b}${b === nickname ? '' : ''}</span>`
      ).join('') + (buddies.length > 4 ? `<span class="buddy-tag">+${buddies.length - 4}</span>` : '');
    }

    // Data: load all meals
    async function loadMeals() {
      try {
        const { data, error } = await client.from('meals').select('*');
        if (error) throw error;
        meals = {};
        data.forEach(row => {
          meals[row.date] = {
            dish: row.dish,
            emoji: row.emoji,
            creator: row.creator || row.nickname,
            participants: parseParticipants(row.participants),
            updatedAt: new Date(row.updated_at).getTime()
          };
        });
      } catch (e) { console.error('loadMeals:', e); }
      renderCalendar();
      renderBuddyList();
    }

    // Data: save slot
    async function saveSlot(key, mealData) {
      try {
        const participants = [nickname].filter(Boolean);
        const { error } = await client.from('meals').upsert({
          date: key,
          dish: mealData.dish,
          emoji: mealData.emoji,
          creator: nickname,
          participants: participants,
          updated_at: new Date().toISOString()
        }, { onConflict: 'date' });
        if (error) throw error;
      } catch (e) { console.error('saveSlot:', e); alert('保存失败：' + (e.message || e)); }
    }

    // Data: join slot
    async function joinSlot(key) {
      const meal = meals[key];
      if (!meal) return;
      if (!nickname) { openNicknameModal(); return; }
      const participants = meal.participants.includes(nickname) ? meal.participants : [...meal.participants, nickname];
      try {
        const { error } = await client.from('meals').update({
          participants: participants,
          updated_at: new Date().toISOString()
        }).eq('date', key);
        if (error) throw error;
      } catch (e) { console.error('joinSlot:', e); }
    }

    async function leaveSlot(key) {
      const meal = meals[key];
      if (!meal) return;
      const participants = meal.participants.filter(n => n !== nickname);
      try {
        const { error } = await client.from('meals').update({
          participants: participants,
          updated_at: new Date().toISOString()
        }).eq('date', key);
        if (error) throw error;
      } catch (e) { console.error('leaveSlot:', e); }
    }

    async function deleteSlot(key) {
      if (!confirm('确定删除这个slot吗？')) return;
      try {
        const { error } = await client.from('meals').delete().eq('date', key);
        if (error) throw error;
        delete meals[key];
        renderCalendar();
        renderBuddyList();
        closeDetailModal();
      } catch (e) { console.error('deleteSlot:', e); }
    }

    // Move requests
    async function loadMoveRequests() {
      try {
        const { data, error } = await client.from('move_requests').select('*').eq('status', 'pending');
        if (error) throw error;
        pendingMoveRequests = data || [];
        showMoveRequestNotifications();
      } catch (e) { console.error('loadMoveRequests:', e); }
    }

    async function createMoveRequest(fromKey, toKey) {
      const meal = meals[fromKey];
      if (!meal) return;
      if (!nickname) { openNicknameModal(); return; }
      const from = parseSlotKey(fromKey);
      const to = parseSlotKey(toKey);

      try {
        const { error } = await client.from('move_requests').insert({
          meal_date: fromKey,
          target_date: toKey,
          dish: meal.dish,
          emoji: meal.emoji,
          requester: nickname,
          creator: meal.creator,
          status: 'pending'
        });
        if (error) throw error;
        showToast('改期请求已发送', `${nickname} 想把「${meal.dish}」从 ${from.dateStr} 移到 ${to.dateStr}`, null);
      } catch (e) { console.error('createMoveRequest:', e); alert('发送失败：' + (e.message || e)); }
    }

    async function approveMoveRequest(requestId) {
      const req = pendingMoveRequests.find(r => r.id === requestId);
      if (!req) return;
      try {
        const participants = [...new Set([req.creator, req.requester])];
        const { error: insertErr } = await client.from('meals').upsert({
          date: req.target_date,
          dish: req.dish,
          emoji: req.emoji,
          creator: req.creator,
          participants: participants,
          updated_at: new Date().toISOString()
        }, { onConflict: 'date' });
        if (insertErr) throw insertErr;
        if (req.meal_date !== req.target_date) {
          const { error: delErr } = await client.from('meals').delete().eq('date', req.meal_date);
          if (delErr) throw delErr;
        }
        await client.from('move_requests').update({ status: 'approved' }).eq('id', requestId);
        showToast('已同意改期', `「${req.dish}」已移到新日期`, null);
      } catch (e) { console.error('approveMoveRequest:', e); alert('操作失败'); }
    }

    async function rejectMoveRequest(requestId) {
      try { await client.from('move_requests').update({ status: 'rejected' }).eq('id', requestId); } catch (e) {}
    }

    // Calendar rendering
    function renderCalendar() {
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const firstDow = new Date(currentYear, currentMonth, 1).getDay();
      const adjusted = firstDow === 0 ? 6 : firstDow - 1;

      calendarGrid.innerHTML = '';

      WEEKDAYS.forEach(d => {
        const el = document.createElement('div');
        el.className = 'weekday-label';
        el.textContent = d;
        calendarGrid.appendChild(el);
      });

      for (let i = 0; i < adjusted; i++) {
        const el = document.createElement('div');
        el.className = 'day-cell';
        el.style.visibility = 'hidden';
        calendarGrid.appendChild(el);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(currentYear, currentMonth, day);
        const dateStr = formatDate(date);
        const today = new Date();
        const isToday = date.toDateString() === today.toDateString();

        const cell = document.createElement('div');
        cell.className = 'day-cell';
        if (isToday) cell.classList.add('today');

        const num = document.createElement('div');
        num.className = 'day-number';
        num.textContent = day;
        cell.appendChild(num);

        SLOTS.forEach(slot => {
          const key = getSlotKey(dateStr, slot.key);
          const meal = meals[key];

          const row = document.createElement('div');
          row.className = 'slot-row';
          if (meal) {
            row.draggable = true;
            row.addEventListener('dragstart', (e) => onDragStart(e, key));
            row.addEventListener('dragend', onDragEnd);
          }
          row.addEventListener('dragover', (e) => onDragOver(e, key));
          row.addEventListener('dragleave', onDragLeave);
          row.addEventListener('drop', (e) => onDrop(e, key));

          const label = document.createElement('div');
          label.className = 'slot-label';
          label.textContent = slot.label;
          row.appendChild(label);

          if (meal) {
            const dish = document.createElement('div');
            dish.className = 'slot-dish';
            dish.textContent = (meal.emoji ? meal.emoji + ' ' : '') + meal.dish;
            row.appendChild(dish);

            const pNames = meal.participants.join('、');
            if (pNames) {
              const p = document.createElement('div');
              p.className = 'slot-participants';
              p.textContent = pNames;
              row.appendChild(p);
            }

            row.addEventListener('click', (e) => {
              e.stopPropagation();
              if (!draggedKey) openDetailModal(key);
            });
          } else {
            const dish = document.createElement('div');
            dish.className = 'slot-dish';
            dish.style.color = 'var(--muted)';
            dish.style.fontStyle = 'italic';
            dish.textContent = '+ 填写';
            row.appendChild(dish);

            row.addEventListener('click', (e) => {
              e.stopPropagation();
              openSlotModal(key);
            });
          }

          cell.appendChild(row);
        });

        calendarGrid.appendChild(cell);
      }

      monthLabel.textContent = `${currentYear}年${MONTHS[currentMonth]}`;
    }

    // Drag & Drop
    function onDragStart(e, key) {
      draggedKey = key;
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', key);
    }
    function onDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      draggedKey = null;
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    }
    function onDragOver(e, targetKey) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (targetKey !== draggedKey && !meals[targetKey]) {
        e.currentTarget.classList.add('drag-over');
      }
    }
    function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    function onDrop(e, targetKey) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      if (!targetKey || !draggedKey || targetKey === draggedKey) return;
      if (meals[targetKey]) { alert('目标slot已有内容'); return; }
      const meal = meals[draggedKey];
      const from = parseSlotKey(draggedKey);
      const to = parseSlotKey(targetKey);
      if (confirm(`要把「${meal.dish}」从 ${from.dateStr} 的 ${SLOTS.find(s=>s.key===from.slotKey)?.label} 移到 ${to.dateStr} 的 ${SLOTS.find(s=>s.key===to.slotKey)?.label} 吗？`)) {
        createMoveRequest(draggedKey, targetKey);
      }
    }

    // Slot modal (create/edit)
    function openSlotModal(key) {
      selectedKey = key;
      const meal = meals[key];
      const { dateStr, slotKey } = parseSlotKey(key);
      const slotLabel = SLOTS.find(s => s.key === slotKey)?.label || slotKey;
      const date = new Date(dateStr);
      const isToday = date.toDateString() === new Date().toDateString();
      slotTitle.textContent = `${isToday ? '今天' : dateStr} · ${slotLabel}`;
      dishInput.value = meal?.dish || '';
      selectedEmoji = meal?.emoji || '';
      slotSubmitBtn.textContent = meal ? '更新' : '创建';
      renderEmojiGrid();
      slotModal.classList.add('active');
      setTimeout(() => dishInput.focus(), 300);
    }
    function closeSlotModal() { slotModal.classList.remove('active'); selectedKey = null; slotForm.reset(); }

    function renderEmojiGrid() {
      emojiGrid.innerHTML = '';
      EMOJIS.forEach(emoji => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'emoji-btn' + (emoji === selectedEmoji ? ' selected' : '');
        btn.textContent = emoji;
        btn.addEventListener('click', () => { selectedEmoji = emoji; renderEmojiGrid(); });
        emojiGrid.appendChild(btn);
      });
    }

    // Detail modal
    function openDetailModal(key) {
      const meal = meals[key];
      if (!meal) return;
      const { dateStr, slotKey } = parseSlotKey(key);
      const slotLabel = SLOTS.find(s => s.key === slotKey)?.label || slotKey;
      detailTitle.textContent = `${dateStr} · ${slotLabel}`;

      const isCreator = meal.creator === nickname;
      const isParticipant = meal.participants.includes(nickname);

      let html = `
        <div class="detail-dish">${meal.emoji || '🍽️'} ${meal.dish}</div>
        <div class="detail-section">
          <div class="detail-label">创建人</div>
          <div class="detail-value">${meal.creator || '匿名'}${isCreator ? '（你）' : ''}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">搭子（${meal.participants.length}人）</div>
          <div class="participant-list">
            ${meal.participants.map(p => `<span class="participant-tag${p === nickname ? ' is-you' : ''}">${p}${p === nickname ? '（你）' : ''}</span>`).join('')}
          </div>
        </div>
        <div class="action-btns">
      `;
      if (nickname && nickname !== meal.creator && !isParticipant) {
        html += `<button class="btn-join" onclick="handleJoin('${key}')">🙋 加入搭子</button>`;
      } else if (isParticipant && nickname !== meal.creator) {
        html += `<button class="btn-leave" onclick="handleLeave('${key}')">👋 退出</button>`;
      }
      if (isCreator) {
        html += `<button class="btn-delete" onclick="handleDelete('${key}')">🗑 删除</button>`;
      }
      html += '</div>';
      detailContent.innerHTML = html;
      detailModal.classList.add('active');
    }
    function closeDetailModal() { detailModal.classList.remove('active'); }

    window.handleJoin = async key => { await joinSlot(key); closeDetailModal(); };
    window.handleLeave = async key => { await leaveSlot(key); closeDetailModal(); };
    window.handleDelete = key => { deleteSlot(key); };

    // Buddy modal
    function openBuddyModal() {
      const buddies = getAllBuddies();
      if (buddies.length === 0) {
        buddyModalContent.innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px">还没有搭子，快去创建干饭计划吧！</p>';
      } else {
        buddyModalContent.innerHTML = `<div class="buddy-modal-list">${buddies.map(b =>
          `<div class="buddy-modal-item${b === nickname ? ' is-you' : ''}">
            <div class="buddy-avatar">${b.charAt(0)}</div>
            <div>
              <span class="buddy-name">${b}</span>
              ${b === nickname ? '<span class="buddy-you-tag">（你）</span>' : ''}
            </div>
          </div>`
        ).join('')}</div>`;
      }
      buddyModal.classList.add('active');
    }
    function closeBuddyModal() { buddyModal.classList.remove('active'); }

    // Nickname modal
    function openNicknameModal() { nicknameInput.value = nickname; nicknameModal.classList.add('active'); setTimeout(() => nicknameInput.focus(), 300); }
    function closeNicknameModal() { nicknameModal.classList.remove('active'); }

    // Toast
    function showToast(title, body, actions) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<div class="toast-title">${title}</div><div class="toast-body">${body}</div>${actions ? `<div class="toast-actions">${actions}</div>` : ''}`;
      if (!actions) setTimeout(() => toast.remove(), 4000);
      toastContainer.appendChild(toast);
    }
    function showMoveRequestNotifications() {
      pendingMoveRequests.forEach(req => {
        if (req.creator === nickname && req.status === 'pending') {
          const from = parseSlotKey(req.meal_date);
          const to = parseSlotKey(req.target_date);
          const toast = document.createElement('div');
          toast.className = 'toast';
          toast.innerHTML = `
            <div class="toast-title">📬 改期请求</div>
            <div class="toast-body">${req.requester} 想把「${req.dish}」移到 ${to.dateStr}</div>
            <div class="toast-actions">
              <button class="toast-btn toast-btn-approve" data-id="${req.id}">✅ 同意</button>
              <button class="toast-btn toast-btn-reject" data-id="${req.id}">❌ 拒绝</button>
            </div>`;
          toast.querySelector('.toast-btn-approve').addEventListener('click', e => { e.stopPropagation(); approveMoveRequest(req.id); toast.remove(); pendingMoveRequests = pendingMoveRequests.filter(r => r.id !== req.id); });
          toast.querySelector('.toast-btn-reject').addEventListener('click', e => { e.stopPropagation(); rejectMoveRequest(req.id); toast.remove(); pendingMoveRequests = pendingMoveRequests.filter(r => r.id !== req.id); });
          toastContainer.appendChild(toast);
        }
      });
    }

    // Real-time
    client.channel('meals-channel').on('postgres_changes', { event: '*', schema: 'public', table: 'meals' }, () => { loadMeals(); }).subscribe();
    client.channel('move-requests-channel').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'move_requests' }, payload => {
      const req = payload.new;
      if (req.status === 'pending') { pendingMoveRequests.push(req); if (req.creator === nickname) showMoveRequestNotifications(); }
    }).subscribe();

    // Events
    slotForm.addEventListener('submit', async e => {
      e.preventDefault();
      const dish = dishInput.value.trim();
      if (!dish || !selectedKey) return;
      await saveSlot(selectedKey, { dish, emoji: selectedEmoji });
      closeSlotModal();
    });

    nicknameForm.addEventListener('submit', e => {
      e.preventDefault();
      const nn = nicknameInput.value.trim();
      if (!nn) return;
      nickname = nn;
      localStorage.setItem(NICKNAME_KEY, nickname);
      closeNicknameModal();
      renderBuddyList();
    });

    slotClose.addEventListener('click', closeSlotModal);
    detailClose.addEventListener('click', closeDetailModal);
    buddyModalClose.addEventListener('click', closeBuddyModal);
    nicknameClose.addEventListener('click', closeNicknameModal);
    buddyBtn.addEventListener('click', openBuddyModal);

    slotModal.addEventListener('click', e => { if (e.target === slotModal) closeSlotModal(); });
    detailModal.addEventListener('click', e => { if (e.target === detailModal) closeDetailModal(); });
    buddyModal.addEventListener('click', e => { if (e.target === buddyModal) closeBuddyModal(); });
    nicknameModal.addEventListener('click', e => { if (e.target === nicknameModal) closeNicknameModal(); });

    $('prevMonth').addEventListener('click', () => { currentMonth--; if(currentMonth<0){currentMonth=11;currentYear--;} renderCalendar(); });
    $('nextMonth').addEventListener('click', () => { currentMonth++; if(currentMonth>11){currentMonth=0;currentYear++;} renderCalendar(); });
    $('todayBtn').addEventListener('click', () => { const t=new Date(); currentYear=t.getFullYear(); currentMonth=t.getMonth(); renderCalendar(); });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if(slotModal.classList.contains('active')) closeSlotModal();
        if(detailModal.classList.contains('active')) closeDetailModal();
        if(buddyModal.classList.contains('active')) closeBuddyModal();
        if(nicknameModal.classList.contains('active')) closeNicknameModal();
      }
    });

    async function init() {
      renderBuddyList();
      await loadMeals();
      await loadMoveRequests();
      if (!nickname) setTimeout(() => openNicknameModal(), 600);
    }
    init();
  </script>
</body>
</html>
