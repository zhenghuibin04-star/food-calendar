<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>干饭搭子</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg: #FFF6E3; --surface: #FFFBEF; --primary: #FFB93D; --primary-deep: #F5A623;
      --ink: #6B4A2B; --muted: #A9855B; --accent: #E8593C; --accent-light: #FFD6CC;
      --border: #F2DFB6; --shadow: rgba(107,74,43,0.08); --success: #4CAF50;
      --slot-bg: rgba(255,185,61,0.12); --plan-bg: rgba(255,185,61,0.15);
      --font-display: 'ZCOOL KuaiLe', system-ui, sans-serif;
      --font-body: 'Noto Sans SC', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --side-padding: clamp(12px, 3vw, 24px);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:#2A2118;--surface:#37291B;--primary:#FFD06B;--primary-deep:#FFB93D;
        --ink:#F4E3C4;--muted:#C4A87A;--accent:#FF7A5C;--accent-light:#5C2A1E;
        --border:#4A3926;--shadow:rgba(0,0,0,0.3);--success:#66BB6A;
        --slot-bg:rgba(255,185,61,0.1);--plan-bg:rgba(255,185,61,0.15);
        color-scheme:dark;
      }
    }
    :root[data-theme="dark"] {
      --bg:#2A2118;--surface:#37291B;--primary:#FFD06B;--primary-deep:#FFB93D;
      --ink:#F4E3C4;--muted:#C4A87A;--accent:#FF7A5C;--accent-light:#5C2A1E;
      --border:#4A3926;--shadow:rgba(0,0,0,0.3);--success:#66BB6A;
      --slot-bg:rgba(255,185,61,0.1);--plan-bg:rgba(255,185,61,0.15);
      color-scheme:dark;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
      padding-inline:var(--side-padding);
      padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);
      min-height:100vh;
    }
    .container{max-width:1400px;margin:0 auto;padding-block:20px}
    .calendar-and-sidebar{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
    @media(max-width:900px){.calendar-and-sidebar{grid-template-columns:1fr}}
    .sidebar{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:16px;height:430px;display:flex;flex-direction:column}

    .header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
    .title{font-family:var(--font-display);font-size:clamp(24px,5vw,36px);color:var(--primary);text-shadow:2px 2px 4px var(--shadow);display:flex;align-items:center;gap:10px}
    .title-emoji{font-size:1.2em;animation:wiggle 2s ease-in-out infinite}
    @keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

    .buddy-btn{
      background:var(--surface);border:2px solid var(--border);border-radius:20px;
      padding:8px 14px;font-family:var(--font-body);font-size:13px;color:var(--ink);
      cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;max-width:200px;
    }
    .buddy-btn:hover{background:var(--primary);border-color:var(--primary-deep);transform:translateY(-2px)}
    .buddy-list{display:flex;flex-wrap:wrap;gap:4px;font-size:12px}
    .buddy-tag{background:var(--primary);color:var(--bg);padding:2px 8px;border-radius:10px;font-weight:500;white-space:nowrap}
    .buddy-tag.is-you{background:var(--accent);color:white}

    .month-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
    .month-nav-btn{background:var(--surface);border:2px solid var(--border);border-radius:10px;padding:6px 14px;font-family:var(--font-body);font-size:13px;color:var(--ink);cursor:pointer;transition:all 0.2s;font-weight:500}
    .month-nav-btn:hover{background:var(--primary);border-color:var(--primary-deep);transform:translateY(-2px)}
    .month-label{font-family:var(--font-display);font-size:clamp(18px,4vw,24px);color:var(--ink);min-width:140px;text-align:center}

    .sync-indicator{text-align:center;padding:4px;font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px}
    .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
    .hint-text{text-align:center;font-size:11px;color:var(--muted);padding:4px 12px;margin-bottom:10px}

    .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:24px}
    @media(max-width:768px){.calendar-grid{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:480px){.calendar-grid{grid-template-columns:repeat(3,1fr)}}
    .weekday-label{text-align:center;font-family:var(--font-display);font-size:12px;color:var(--muted);padding:4px 0;font-weight:500}

    .day-cell{
      background:var(--surface);border:2px solid var(--border);border-radius:12px;
      padding:8px;min-height:100px;cursor:pointer;transition:all 0.2s;
      display:flex;flex-direction:column;gap:4px;position:relative;
    }
    .day-cell:hover{transform:translateY(-2px);box-shadow:0 4px 16px var(--shadow);border-color:var(--primary)}
    .day-cell.today{background:var(--primary);border-color:var(--primary-deep)}
    .day-cell.today .day-number{color:var(--bg)}
    .day-cell.drag-over{border-color:var(--success);border-width:3px;background:var(--accent-light)}
    .day-number{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:2px}

    .plan-card{
      background:var(--plan-bg);border-radius:8px;padding:4px 6px;
      cursor:pointer;transition:all 0.15s;
      display:flex;flex-direction:column;gap:1px;
    }
    .plan-card:hover{background:var(--primary);transform:scale(1.02)}
    .plan-card:hover .plan-type,.plan-card:hover .plan-dish,.plan-card:hover .plan-participants{color:var(--bg)}
    .plan-type{font-size:9px;color:var(--muted);font-weight:500;line-height:1}
    .plan-dish{font-size:11px;font-weight:500;color:var(--ink);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .plan-participants{font-size:9px;color:var(--muted);line-height:1.1}

    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.3s}
    .modal-overlay.active{opacity:1;pointer-events:auto}
    .modal{background:var(--surface);border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform 0.3s}
    .modal-overlay.active .modal{transform:translateY(0)}
    .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .modal-title{font-family:var(--font-display);font-size:20px;color:var(--primary)}
    .modal-close{background:transparent;border:none;font-size:26px;color:var(--muted);cursor:pointer;padding:4px 10px;border-radius:8px;transition:all 0.2s}
    .modal-close:hover{background:var(--border);color:var(--ink)}

    .form-group{margin-bottom:14px}
    .form-label{display:block;font-family:var(--font-display);font-size:14px;color:var(--ink);margin-bottom:6px;font-weight:500}
    .form-input{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:10px 14px;font-family:var(--font-body);font-size:15px;color:var(--ink);transition:all 0.2s}
    .form-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,185,61,0.2)}

    .type-selector{display:flex;gap:8px}
    .type-btn{
      flex:1;background:var(--bg);border:2px solid var(--border);border-radius:10px;
      padding:10px 8px;font-family:var(--font-body);font-size:13px;color:var(--ink);
      cursor:pointer;transition:all 0.2s;text-align:center;
    }
    .type-btn:hover{border-color:var(--primary);background:var(--slot-bg)}
    .type-btn.selected{background:var(--primary);border-color:var(--primary-deep);color:var(--bg);font-weight:700}

    .emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px}
    .emoji-btn{background:var(--bg);border:2px solid var(--border);border-radius:8px;padding:8px;font-size:20px;cursor:pointer;transition:all 0.2s;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
    .emoji-btn:hover{transform:scale(1.1);border-color:var(--primary)}
    .emoji-btn.selected{background:var(--primary);border-color:var(--primary-deep)}
    .submit-btn{width:100%;background:var(--primary);border:none;border-radius:12px;padding:12px;font-family:var(--font-display);font-size:16px;color:var(--bg);cursor:pointer;transition:all 0.2s;font-weight:700}
    .submit-btn:hover{background:var(--primary-deep);transform:translateY(-2px)}

    .plan-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
    .plan-list-item{
      background:var(--plan-bg);border:2px solid var(--border);border-radius:12px;padding:12px;
      cursor:pointer;transition:all 0.2s;
    }
    .plan-list-item:hover{border-color:var(--primary);background:var(--slot-bg)}
    .plan-list-item.is-joined{border-color:var(--success);background:rgba(76,175,80,0.1)}
    .plan-list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
    .plan-list-type{font-size:12px;color:var(--muted);font-weight:500}
    .plan-list-dish{font-size:16px;font-family:var(--font-display);color:var(--ink);margin-bottom:4px}
    .plan-list-creator{font-size:11px;color:var(--muted)}
    .plan-list-count{font-size:12px;color:var(--success);font-weight:500}

    .type-section{margin-bottom:16px}
    .type-section-title{font-family:var(--font-display);font-size:14px;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:6px}
    .create-type-btn{
      width:100%;background:var(--bg);border:2px dashed var(--border);border-radius:10px;padding:10px;
      font-family:var(--font-display);font-size:13px;color:var(--muted);cursor:pointer;transition:all 0.2s;
      display:flex;align-items:center;justify-content:center;gap:6px;
    }
    .create-type-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--slot-bg)}

    .detail-dish{font-size:20px;font-family:var(--font-display);color:var(--primary);margin-bottom:10px}
    .detail-section{margin-bottom:12px}
    .detail-label{font-size:12px;color:var(--muted);margin-bottom:3px}
    .detail-value{font-size:15px;font-weight:500;color:var(--ink)}
    .participant-list{display:flex;flex-wrap:wrap;gap:5px}
    .participant-tag{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px 10px;font-size:12px;color:var(--ink)}
    .participant-tag.is-you{background:var(--primary);color:var(--bg);border-color:var(--primary-deep)}
    .action-btns{display:flex;gap:8px;margin-top:14px}
    .btn-join{flex:1;background:var(--success);color:white;border:none;border-radius:10px;padding:10px;font-family:var(--font-display);font-size:14px;cursor:pointer;transition:all 0.2s}
    .btn-join:hover{opacity:0.9}
    .btn-leave{flex:1;background:var(--accent);color:white;border:none;border-radius:10px;padding:10px;font-family:var(--font-display);font-size:14px;cursor:pointer;transition:all 0.2s}
    .btn-leave:hover{opacity:0.9}
    .btn-delete{flex:1;background:var(--bg);color:var(--accent);border:2px solid var(--accent);border-radius:10px;padding:10px;font-family:var(--font-display);font-size:14px;cursor:pointer;transition:all 0.2s}
    .btn-delete:hover{background:var(--accent);color:white}

    .sidebar-title{font-family:var(--font-display);font-size:18px;color:var(--primary);margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .comment-list{display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto;margin-bottom:12px}
    .comment-item{background:var(--bg);border-radius:10px;padding:10px}
    .comment-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
    .comment-author{font-size:12px;font-weight:500;color:var(--ink)}
    .comment-time{font-size:10px;color:var(--muted)}
    .comment-content{font-size:13px;color:var(--ink);line-height:1.4}
    .comment-form{display:flex;gap:8px}
    .comment-input{flex:1;background:var(--bg);border:2px solid var(--border);border-radius:8px;padding:8px 12px;font-family:var(--font-body);font-size:13px;color:var(--ink)}
    .comment-input:focus{outline:none;border-color:var(--primary)}
    .comment-submit{background:var(--primary);border:none;border-radius:8px;padding:8px 14px;font-family:var(--font-display);font-size:13px;color:var(--bg);cursor:pointer}

    .buddy-modal-list{display:flex;flex-direction:column;gap:8px}
    .buddy-modal-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-radius:12px;border:1px solid var(--border)}
    .buddy-modal-item.is-you{border-color:var(--primary);background:var(--slot-bg)}
    .buddy-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--bg);font-weight:700;font-family:var(--font-display)}
    .buddy-modal-item.is-you .buddy-avatar{background:var(--accent)}
    .buddy-name{font-size:15px;font-weight:500;color:var(--ink)}
    .buddy-you-tag{font-size:11px;color:var(--muted);margin-left:4px}

    .toast-container{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:6px;width:90%;max-width:380px}
    .toast{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:12px 16px;box-shadow:0 6px 24px var(--shadow);animation:slideDown 0.3s ease-out}
    @keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
    .toast-title{font-family:var(--font-display);font-size:14px;color:var(--accent);margin-bottom:3px}
    .toast-body{font-size:12px;color:var(--ink)}

    .empty-state{text-align:center;color:var(--muted);padding:20px;font-size:13px}

    *:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
    @media(prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
    @media(max-width:900px){.sidebar{margin-top:0}}
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>
  <div class="container">
    <header class="header">
      <h1 class="title">
        <span class="title-emoji">😋</span>
        <span>干饭搭子</span>
        <span class="title-emoji">️</span>
      </h1>
      <button class="buddy-btn" id="buddyBtn">
        <div class="buddy-list" id="buddyList"><span>加载中...</span></div>
      </button>
    </header>
    <nav class="month-nav">
      <button class="month-nav-btn" id="prevMonth">‹ 上月</button>
      <div class="month-label" id="monthLabel">2026年10月</div>
      <button class="month-nav-btn" id="nextMonth">下月 ›</button>
      <button class="month-nav-btn" id="todayBtn">今天</button>
    </nav>
    <div class="sync-indicator"><span class="sync-dot"></span><span>实时同步 · 多人协作</span></div>
    <div class="hint-text">💡 点格子查看/加入计划 · 可以创建自己的计划让搭子选择</div>
  </div>

  <!-- Calendar + Sidebar aligned -->
  <div class="calendar-and-sidebar" style="max-width:1400px;margin:0 auto;padding:0 var(--side-padding)">
    <main style="min-width:0"><div class="calendar-grid" id="calendarGrid"></div></main>
    <aside class="sidebar">
      <div class="sidebar-title"> 留言板</div>
      <div class="comment-list" id="sidebarCommentList">
        <div class="empty-state">还没有留言，说点什么吧～</div>
      </div>
      <div class="comment-form">
        <input type="text" class="comment-input" id="sidebarCommentInput" placeholder="说点什么..." maxlength="100">
        <button class="comment-submit" id="sidebarCommentSubmit">发送</button>
      </div>
    </aside>
  </div>

  <!-- Cell modal: shows plans for a date -->
  <div class="modal-overlay" id="cellModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="cellTitle">今天吃什么？</h2>
        <button class="modal-close" id="cellClose">×</button>
      </div>
      <div id="cellContent"></div>
    </div>
  </div>

  <!-- Create plan modal -->
  <div class="modal-overlay" id="createModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="createTitle">创建计划</h2>
        <button class="modal-close" id="createClose">×</button>
      </div>
      <form id="createForm">
        <div class="form-group">
          <label class="form-label">选择类型</label>
          <div class="type-selector" id="typeSelector">
            <button type="button" class="type-btn" data-type="lunch">中午吃啥</button>
            <button type="button" class="type-btn" data-type="dinner">晚上吃啥</button>
            <button type="button" class="type-btn" data-type="drink">喝点啥</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="dishInput">吃什么/喝什么</label>
          <input type="text" id="dishInput" class="form-input" placeholder="" required autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">选个心情</label>
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>
        <button type="submit" class="submit-btn">创建计划</button>
      </form>
    </div>
  </div>

  <!-- Detail modal: plan details -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="detailTitle">计划详情</h2>
        <button class="modal-close" id="detailClose">×</button>
      </div>
      <div id="detailContent"></div>
    </div>
  </div>

  <!-- Buddy modal -->
  <div class="modal-overlay" id="buddyModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">👥 我的搭子们</h2>
        <button class="modal-close" id="buddyModalClose">×</button>
      </div>
      <div id="buddyModalContent"></div>
    </div>
  </div>

  <!-- Nickname modal -->
  <div class="modal-overlay" id="nicknameModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">你的昵称</h2>
        <button class="modal-close" id="nicknameClose">×</button>
      </div>
      <form id="nicknameForm">
        <div class="form-group">
          <label class="form-label" for="nicknameInput">输入昵称</label>
          <input type="text" id="nicknameInput" class="form-input" placeholder="小明" required autocomplete="off" maxlength="20">

    </div>
  </div>

    const buddyList = $('buddyList');
    const cellModal = $('cellModal');
    const cellTitle = $('cellTitle');
    const cellContent = $('cellContent');
    const cellClose = $('cellClose');
    const createModal = $('createModal');
    const createForm = $('createForm');
    const createTitle = $('createTitle');
    const createClose = $('createClose');
    const dishInput = $('dishInput');
    const emojiGrid = $('emojiGrid');
    const typeSelector = $('typeSelector');
    const detailModal = $('detailModal');
    const detailTitle = $('detailTitle');
    const detailContent = $('detailContent');
    const detailClose = $('detailClose');
    const buddyModal = $('buddyModal');
    const buddyModalContent = $('buddyModalContent');
    const buddyModalClose = $('buddyModalClose');
    const nicknameModal = $('nicknameModal');
    const nicknameForm = $('nicknameForm');
    const nicknameInput = $('nicknameInput');
    const nicknameClose = $('nicknameClose');
    const toastContainer = $('toastContainer');
    const sidebarCommentList = $('sidebarCommentList');
    const sidebarCommentInput = $('sidebarCommentInput');
    const sidebarCommentSubmit = $('sidebarCommentSubmit');

    function formatDate(date) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }
    function parseParticipants(p) {
      if (!p) return [];
      if (Array.isArray(p)) return p;
      try { return JSON.parse(p); } catch { return []; }
    }
    function formatTime(ts) {
      const d = new Date(ts);
      return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function getAllBuddies() {
      const set = new Set();
      Object.values(plans).forEach(dayPlans => {
        dayPlans.forEach(p => {
          if (p.creator) set.add(p.creator);
          (p.participants || []).forEach(pp => set.add(pp));
        });
      });
      const arr = Array.from(set);
      if (nickname) {
        const idx = arr.indexOf(nickname);
        if (idx > 0) { arr.splice(idx, 1); arr.unshift(nickname); }
        else if (idx === -1) arr.unshift(nickname);
      }
      return arr;
    }

    function renderBuddyList() {
      const buddies = getAllBuddies();
      if (buddies.length === 0 || (buddies.length === 1 && buddies[0] === nickname)) {
        buddyList.innerHTML = nickname ? `<span class="buddy-tag is-you">${nickname}</span>` : '<span>设置昵称</span>';
        return;
      }
      buddyList.innerHTML = buddies.slice(0, 3).map(b =>
        `<span class="buddy-tag${b === nickname ? ' is-you' : ''}">${b}</span>`
      ).join('') + (buddies.length > 3 ? `<span class="buddy-tag">+${buddies.length - 3}</span>` : '');
    }

    async function loadPlans() {
      try {
        const { data, error } = await client.from('plans').select('*');
        if (error) throw error;
        plans = {};
        data.forEach(row => {
          if (!plans[row.date]) plans[row.date] = [];
          plans[row.date].push({
            id: row.id,
            slot_type: row.slot_type,
            dish: row.dish,
            emoji: row.emoji || '',
            creator: row.creator,
            participants: parseParticipants(row.participants),
            created_at: row.created_at
          });
        });
      } catch (e) { console.error('loadPlans:', e); }
      renderCalendar();
      renderBuddyList();
    }

    async function loadComments() {
      try {
        const { data, error } = await client.from('comments').select('*');
        if (error) throw error;
        comments = {};
        data.forEach(row => {
          if (!comments[row.date]) comments[row.date] = [];
          comments[row.date].push({
            id: row.id,
            author: row.author,
            content: row.content,
            created_at: row.created_at
          });
        });
        Object.values(comments).forEach(arr => arr.sort((a,b) => new Date(a.created_at) - new Date(b.created_at)));
        renderSidebarComments();
      } catch (e) { console.error('loadComments:', e); }
    }

    async function createPlan(dateStr, slotType, dish, emoji) {
      try {
        const participants = [nickname].filter(Boolean);
        const { data, error } = await client.from('plans').insert({
          date: dateStr, slot_type: slotType, dish, emoji,
          creator: nickname, participants
        }).select().single();
        if (error) throw error;
        showToast('计划已创建', `${dish} - 等搭子加入！`);
        return data;
      } catch (e) { console.error('createPlan:', e); alert('创建失败：' + (e.message || e)); }
    }

    async function joinPlan(planId) {
      if (!nickname) { openNicknameModal(); return; }
      const plan = findPlan(planId);
      if (!plan) return;
      const participants = plan.participants.includes(nickname) ? plan.participants : [...plan.participants, nickname];
      try {
        const { error } = await client.from('plans').update({ participants }).eq('id', planId);
        if (error) throw error;
        showToast('已加入', `一起${SLOT_TYPES[plan.slot_type]}！`);
      } catch (e) { console.error('joinPlan:', e); }
    }

    async function leavePlan(planId) {
      const plan = findPlan(planId);
      if (!plan) return;
      const participants = plan.participants.filter(n => n !== nickname);
      try {
        const { error } = await client.from('plans').update({ participants }).eq('id', planId);
        if (error) throw error;
      } catch (e) { console.error('leavePlan:', e); }
    }

    async function deletePlan(planId) {
      if (!confirm('确定删除这个计划吗？')) return;
      try {
        const { error } = await client.from('plans').delete().eq('id', planId);
        if (error) throw error;
        showToast('已删除', '计划已移除');
      } catch (e) { console.error('deletePlan:', e); }
    }

    async function addComment(dateStr, content) {
      if (!nickname || !content.trim()) return;
      try {
        const { error } = await client.from('comments').insert({
          date: dateStr, author: nickname, content: content.trim()
        });
        if (error) throw error;
      } catch (e) { console.error('addComment:', e); alert('发送失败'); }
    }

    function findPlan(planId) {
      for (const dayPlans of Object.values(plans)) {
        const plan = dayPlans.find(p => p.id === planId);
        if (plan) return plan;
      }
      return null;
    }

    // Calendar
    function renderCalendar() {
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const firstDow = new Date(currentYear, currentMonth, 1).getDay();
      const adjusted = firstDow === 0 ? 6 : firstDow - 1;

      calendarGrid.innerHTML = '';
      WEEKDAYS.forEach(d => {
        const el = document.createElement('div');
        el.className = 'weekday-label'; el.textContent = d;
        calendarGrid.appendChild(el);
      });
      for (let i = 0; i < adjusted; i++) {
        const el = document.createElement('div');
        el.className = 'day-cell'; el.style.visibility = 'hidden';
        calendarGrid.appendChild(el);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(currentYear, currentMonth, day);
        const dateStr = formatDate(date);
        const isToday = date.toDateString() === new Date().toDateString();

        const cell = document.createElement('div');
        cell.className = 'day-cell';
        if (isToday) cell.classList.add('today');

        const num = document.createElement('div');
        num.className = 'day-number'; num.textContent = day;
        cell.appendChild(num);

        const dayPlans = plans[dateStr] || [];
        const typeOrder = ['lunch', 'dinner', 'drink'];
        const shownTypes = new Set();

        dayPlans.sort((a,b) => typeOrder.indexOf(a.slot_type) - typeOrder.indexOf(b.slot_type)).forEach(plan => {
          if (shownTypes.has(plan.slot_type)) return;
          shownTypes.add(plan.slot_type);

          const card = document.createElement('div');
          card.className = 'plan-card';
          card.innerHTML = `
            <div class="plan-type">${SLOT_ICONS[plan.slot_type] || ''} ${SLOT_TYPES[plan.slot_type] || plan.slot_type}</div>
            <div class="plan-dish">${plan.emoji ? plan.emoji + ' ' : ''}${plan.dish}</div>
            <div class="plan-participants">${plan.creator}${plan.participants.length > 0 ? ` · ${plan.participants.length}人` : ''}</div>
          `;
          card.addEventListener('click', e => {
            e.stopPropagation();
            openDetailModal(plan.id);
          });
          cell.appendChild(card);
        });

        cell.dataset.date = dateStr;
        cell.addEventListener('click', () => openCellModal(dateStr));
        calendarGrid.appendChild(cell);
      }
      monthLabel.textContent = `${currentYear}年${MONTHS[currentMonth]}`;
    }

    // Cell modal
    function openCellModal(dateStr) {
      selectedDate = dateStr;
      const date = new Date(dateStr);
      const isToday = date.toDateString() === new Date().toDateString();
      cellTitle.textContent = `${isToday ? '今天' : dateStr} 的干饭计划`;

      const dayPlans = plans[dateStr] || [];
      const typeOrder = ['lunch', 'dinner', 'drink'];
      const plansByType = { lunch: [], dinner: [], drink: [] };
      dayPlans.forEach(p => { if (plansByType[p.slot_type]) plansByType[p.slot_type].push(p); });

      let html = '';
      typeOrder.forEach(type => {
        const typePlans = plansByType[type];
        html += `<div class="type-section">`;
        html += `<div class="type-section-title">${SLOT_ICONS[type]} ${SLOT_TYPES[type]}</div>`;

        if (typePlans.length === 0) {
          html += `<button class="create-type-btn" data-type="${type}"><span>+</span> 创建新计划</button>`;
        } else {
          typePlans.forEach(plan => {
            const isJoined = plan.participants.includes(nickname);
            html += `
              <div class="plan-list-item${isJoined ? ' is-joined' : ''}" data-plan-id="${plan.id}">
                <div class="plan-list-header">
                  <span class="plan-list-type">${SLOT_ICONS[plan.slot_type]} ${SLOT_TYPES[plan.slot_type]}</span>
                  <span class="plan-list-count">${plan.participants.length}人${isJoined ? ' · 已加入' : ''}</span>
                </div>
                <div class="plan-list-dish">${plan.emoji ? plan.emoji + ' ' : ''}${plan.dish}</div>
                <div class="plan-list-creator">${plan.creator} 创建</div>
              </div>
            `;
          });
          html += `<button class="create-type-btn" data-type="${type}"><span>+</span> 再创建一个</button>`;
        }
        html += `</div>`;
      });

      cellContent.innerHTML = html;

      cellContent.querySelectorAll('.plan-list-item').forEach(item => {
        item.addEventListener('click', () => {
          const planId = item.dataset.planId;
          closeCellModal();
          openDetailModal(planId);
        });
      });

      cellContent.querySelectorAll('.create-type-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const type = btn.dataset.type;
          closeCellModal();
          openCreateModal(dateStr, type);
        });
      });

      cellModal.classList.add('active');
    }
    function closeCellModal() { cellModal.classList.remove('active'); }

    // Create modal
    function openCreateModal(dateStr, preselectType) {
      selectedDate = dateStr;
      selectedType = preselectType || null;
      selectedEmoji = '';
      const date = new Date(dateStr);
      const isToday = date.toDateString() === new Date().toDateString();
      createTitle.textContent = `${isToday ? '今天' : dateStr} 创建计划`;
      dishInput.value = '';

      typeSelector.querySelectorAll('.type-btn').forEach(btn => {
        btn.classList.remove('selected');
        if (btn.dataset.type === selectedType) btn.classList.add('selected');
        btn.onclick = () => {
          typeSelector.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedType = btn.dataset.type;
        };
      });

      renderEmojiGrid();
      createModal.classList.add('active');
    }
    function closeCreateModal() { createModal.classList.remove('active'); selectedDate = null; selectedType = null; createForm.reset(); }

    function renderEmojiGrid() {
      emojiGrid.innerHTML = '';
      EMOJIS.forEach(emoji => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'emoji-btn' + (emoji === selectedEmoji ? ' selected' : '');
        btn.textContent = emoji;
        btn.addEventListener('click', () => { selectedEmoji = emoji; renderEmojiGrid(); });
        emojiGrid.appendChild(btn);
      });
    }

    // Detail modal
    function openDetailModal(planId) {
      const plan = findPlan(planId);
      if (!plan) return;
      currentPlanId = planId;

      const typeName = `${SLOT_ICONS[plan.slot_type] || ''} ${SLOT_TYPES[plan.slot_type] || plan.slot_type}`;
      detailTitle.textContent = typeName;

      const isCreator = plan.creator === nickname;
      const isParticipant = plan.participants.includes(nickname);

      // Find the date for this plan
      const planDate = Object.keys(plans).find(d => plans[d].some(p => p.id === planId));

      let html = `
        <div class="detail-dish">${plan.emoji || ''} ${plan.dish}</div>
        <div class="detail-section">
          <div class="detail-label">创建人</div>
          <div class="detail-value">${plan.creator}${isCreator ? '（你）' : ''}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">搭子（${plan.participants.length}人）</div>
          <div class="participant-list">
            ${plan.participants.length === 0 ? '<span style="color:var(--muted);font-size:12px">还没有人加入</span>' : ''}
            ${plan.participants.map(p => `<span class="participant-tag${p === nickname ? ' is-you' : ''}">${p}${p === nickname ? '（你）' : ''}</span>`).join('')}
          </div>
        </div>
        <div class="action-btns">`;
      if (nickname && nickname !== plan.creator && !isParticipant)
        html += `<button class="btn-join" onclick="handleJoin('${planId}')">🙋 加入</button>`;
      else if (isParticipant && nickname !== plan.creator)
        html += `<button class="btn-leave" onclick="handleLeave('${planId}')">👋 退出</button>`;
      if (isCreator)
        html += `<button class="btn-delete" onclick="handleDelete('${planId}')">🗑 删除</button>`;
      html += '</div>';

      // Add "manage plans" button only for creator
      if (planDate && isCreator) {
        html += `<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">`;
        html += `<button class="create-type-btn" onclick="handleManagePlans('${planDate}')" style="width:100%">➕ 添加其他类型的计划（晚饭/饮品等）</button>`;
        html += `</div>`;
      }

      detailContent.innerHTML = html;
      detailModal.classList.add('active');
    }
    function closeDetailModal() { detailModal.classList.remove('active'); currentPlanId = null; }
    window.handleJoin = async planId => { await joinPlan(planId); openDetailModal(planId); };
    window.handleLeave = async planId => { await leavePlan(planId); openDetailModal(planId); };
    window.handleDelete = async planId => { await deletePlan(planId); closeDetailModal(); loadPlans(); };
    window.handleManagePlans = dateStr => { closeDetailModal(); openCellModal(dateStr); };

    // Sidebar comments - show all comments
    function renderSidebarComments() {
      const allComments = [];
      Object.entries(comments).forEach(([dateStr, dateComments]) => {
        dateComments.forEach(c => {
          allComments.push({ ...c, dateStr });
        });
      });
      // Sort by date, then by time
      allComments.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

      if (allComments.length === 0) {
        sidebarCommentList.innerHTML = '<div class="empty-state">还没有留言，说点什么吧～</div>';
      } else {
        let html = '';
        let lastDate = '';
        allComments.forEach(c => {
          // Add date label when date changes
          if (c.dateStr !== lastDate) {
            const date = new Date(c.dateStr);
            const isToday = c.dateStr === formatDate(new Date());
            html += `<div style="font-family:var(--font-display);font-size:13px;color:var(--muted);margin-top:8px;margin-bottom:4px">${date.getMonth()+1}月${date.getDate()}日${isToday ? ' (今天)' : ''}</div>`;
            lastDate = c.dateStr;
          }
          html += `
            <div class="comment-item">
              <div class="comment-header">
                <span class="comment-author">${c.author}${c.author === nickname ? '（你）' : ''}</span>
                <span class="comment-time">${formatTime(c.created_at)}</span>
              </div>
              <div class="comment-content">${c.content}</div>
            </div>`;
        });
        sidebarCommentList.innerHTML = html;
        sidebarCommentList.scrollTop = sidebarCommentList.scrollHeight;
      }
    }

    sidebarCommentSubmit.addEventListener('click', async () => {
      const content = sidebarCommentInput.value.trim();
      if (!content) return;
      const today = formatDate(new Date());
      await addComment(today, content);
      sidebarCommentInput.value = '';
      await loadComments();
    });

    sidebarCommentInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') sidebarCommentSubmit.click();
    });

    // Buddy modal
    function openBuddyModal() {
      const buddies = getAllBuddies();
      if (buddies.length === 0) {
        buddyModalContent.innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px">还没有搭子，快去创建计划吧！</p>';
      } else {
        buddyModalContent.innerHTML = `<div class="buddy-modal-list">${buddies.map(b =>
          `<div class="buddy-modal-item${b === nickname ? ' is-you' : ''}">
            <div class="buddy-avatar">${b.charAt(0)}</div>
            <div><span class="buddy-name">${b}</span>${b === nickname ? '<span class="buddy-you-tag">（你）</span>' : ''}</div>
          </div>`
        ).join('')}</div>`;
      }
      buddyModal.classList.add('active');
    }
    function closeBuddyModal() { buddyModal.classList.remove('active'); }

    // Nickname
    function openNicknameModal() { nicknameInput.value = nickname; nicknameModal.classList.add('active'); setTimeout(() => nicknameInput.focus(), 300); }
    function closeNicknameModal() { nicknameModal.classList.remove('active'); }

    // Toast
    function showToast(title, body) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<div class="toast-title">${title}</div><div class="toast-body">${body}</div>`;
      setTimeout(() => toast.remove(), 3000);
      toastContainer.appendChild(toast);
    }

    // Real-time
    client.channel('plans').on('postgres_changes', { event: '*', schema: 'public', table: 'plans' }, () => loadPlans()).subscribe();
    client.channel('comments').on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, () => { loadComments(); }).subscribe();

    // Events
    createForm.addEventListener('submit', async e => {
      e.preventDefault();
      const dish = dishInput.value.trim();
      if (!dish || !selectedDate || !selectedType) { alert('请填写完整'); return; }
      await createPlan(selectedDate, selectedType, dish, selectedEmoji);
      closeCreateModal();
      await loadPlans();
    });

    nicknameForm.addEventListener('submit', e => {
      e.preventDefault();
      const nn = nicknameInput.value.trim();
      if (!nn) return;
      nickname = nn;
      localStorage.setItem(NICKNAME_KEY, nickname);
      closeNicknameModal();
      renderBuddyList();
    });

    cellClose.addEventListener('click', closeCellModal);
    createClose.addEventListener('click', closeCreateModal);
    detailClose.addEventListener('click', closeDetailModal);
    buddyModalClose.addEventListener('click', closeBuddyModal);
    nicknameClose.addEventListener('click', closeNicknameModal);
    buddyBtn.addEventListener('click', openBuddyModal);

    [cellModal, createModal, detailModal, buddyModal, nicknameModal].forEach(m =>
      m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); })
    );

    $('prevMonth').addEventListener('click', () => { currentMonth--; if(currentMonth<0){currentMonth=11;currentYear--;} renderCalendar(); });
    $('nextMonth').addEventListener('click', () => { currentMonth++; if(currentMonth>11){currentMonth=0;currentYear++;} renderCalendar(); });
    $('todayBtn').addEventListener('click', () => { const t=new Date(); currentYear=t.getFullYear(); currentMonth=t.getMonth(); renderCalendar(); });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape')
        [cellModal, createModal, detailModal, buddyModal, nicknameModal].forEach(m => m.classList.remove('active'));
    });

    async function init() {
      renderBuddyList();
      await Promise.all([loadPlans(), loadComments()]);
      if (!nickname) setTimeout(() => openNicknameModal(), 600);
    }
    init();
  </script>
</body>
</html>
